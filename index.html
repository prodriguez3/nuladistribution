<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nula Distribution</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Oswald:wght@300&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="media/icon.png" />
  </head>
  <body>
    <!-- Hero Section with Background Video -->
    <header class="hero-section">
      <video
        autoplay
        muted
        loop
        playsinline
        poster="fallback-image.jpg"
        class="hero-video"
      >
        <source
          src="media/nula-paloma-one-wipe-reveal (1).mov"
          type="video/mp4"
        />
        Your browser does not support the video tag.
      </video>

      <!-- Dark Overlay for Readability -->
      <div class="hero-overlay"></div>

      <!-- Content over Video -->
      <div class="hero-content">
        <p class="season">Winter 2026</p>

        <div class="brand">
          <h1>NULA</h1>
          <p class="slogan">A new way to drink</p>
        </div>

        <p class="tagline">
          Mexico&rsquo;s first premium NA spirits distributor
        </p>
      </div>
    </header>

    <!-- Footer -->
    <footer class="site-footer">
      <p>
        &copy; 2026 Nula Distribution &middot;
        <a href="mailto:hola@nuladistribution.com">hola@nuladistribution.com</a>
      </p>
    </footer>
  </body>
</html>
