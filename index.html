<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nula Distribution</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Oswald:wght@300&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="media/icon.png" />
  </head>
  <body>
    <!-- Hero Section with Background Video -->
    <header class="hero-section">
      <video
        autoplay
        muted
        loop
        playsinline
        poster="fallback-image.jpg"
        class="hero-video"
      >
        <source
          src="media/nula-paloma-one-wipe-reveal (1).mov"
          type="video/mp4"
        />
        Your browser does not support the video tag.
      </video>

      <!-- Dark Overlay for Readability -->
      <div class="hero-overlay"></div>

      <!-- Language Switch -->
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>

      <!-- Content over Video -->
      <div class="hero-content">
        <p class="season" data-i18n="season">Winter 2026</p>

        <div class="brand">
          <h1>NULA</h1>
          <p class="slogan" data-i18n="slogan">A new way to drink</p>
        </div>

        <p class="tagline" data-i18n="tagline">
          Mexico&rsquo;s first premium NA spirits distributor
        </p>
      </div>
    </header>

    <!-- Footer -->
    <footer class="site-footer">
      <p>
        &copy; 2026 Nula Distribution &middot;
        <a href="mailto:hola@nuladistribution.com">hola@nuladistribution.com</a>
      </p>
    </footer>

    <script>
      const translations = {
        en: {
          season: "Winter 2026",
          slogan: "A new way to drink",
          tagline: "Mexico\u2019s first premium NA spirits distributor",
        },
        es: {
          season: "Invierno 2026",
          slogan: "Una nueva forma de brindar",
          tagline:
            "Distribuidora Mexicana pionera en destilados premium sin alcohol",
        },
      };

      function setLanguage(lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = translations[lang][el.dataset.i18n];
        });
        document.querySelectorAll("[data-lang]").forEach((btn) => {
          btn.setAttribute("aria-pressed", btn.dataset.lang === lang);
        });
        try {
          localStorage.setItem("lang", lang);
        } catch (e) {}
      }

      document.querySelectorAll("[data-lang]").forEach((btn) => {
        btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
      });

      // Start with saved choice, else the browser's language, else English
      let start = "en";
      try {
        start = localStorage.getItem("lang") || start;
      } catch (e) {}
      if (
        !localStorage.getItem?.("lang") &&
        navigator.language.startsWith("es")
      )
        start = "es";
      setLanguage(start);
    </script>
  </body>
</html>
